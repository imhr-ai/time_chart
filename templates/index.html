<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSV Viewer with ECharts</title>
    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f8f9fa;
      }
      #chart-container {
        width: 100%;
        /* 各チャンネルに30pxを割り当てる想定 (150 * 30px = 4500px) */
        height: 4500px;
        border: 1px solid #dee2e6;
        background-color: white;
      }
    </style>
  </head>
  <body>
    <div class="container mt-4">
      <div class="card">
        <div class="card-header">
          <h3>CSVデータ可視化ツール</h3>
        </div>
        <div class="card-body">
          <p class="card-text">
            150カラム x 6000行程度のCSVファイルを想定しています。
          </p>
          <div class="input-group">
            <input
              type="file"
              class="form-control"
              id="csvFile"
              accept=".csv"
            />
            <button class="btn btn-primary" type="button" id="uploadButton">
              グラフ描画
            </button>
          </div>
        </div>
      </div>

      <!-- ローディングスピナー -->
      <div id="loading" class="text-center my-4 d-none">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
        <p>データを処理中です。しばらくお待ちください...</p>
      </div>

      <!-- エラー表示エリア -->
      <div
        id="error-alert"
        class="alert alert-danger mt-4 d-none"
        role="alert"
      ></div>

      <!-- EChartsを描画するコンテナ -->
      <div id="chart-container" class="mt-4" style="display: none"></div>
    </div>

    <!-- EChartsライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <!-- カスタムJavaScript -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </body>
</html>
